<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dungarpur Live News</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{background:#f7f7f7;color:#222;overflow-x:hidden;}

.live-dot{width:10px;height:10px;background:red;border-radius:50%;margin-left:6px;animation:blink 0.8s infinite;}
@keyframes blink{0%{opacity:1;}50%{opacity:0;}100%{opacity:1;}}

header{
  background:#fff;padding:12px 15px;border-bottom:3px solid #d60000;
  position:sticky;top:0;z-index:999;
  display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:20px;font-weight:800;color:#d60000;display:flex;align-items:center;}

.time-box{font-size:12px;font-weight:600;color:#444;text-align:right;}
.time-box span{color:#d60000;font-weight:700;}

.tile-ticker{background:#d60000;padding:10px 0;overflow:hidden;white-space:nowrap;}
.tile-track{display:inline-block;animation:scrollTiles 120s linear infinite;}
.tile{background:#fff;color:#d60000;padding:6px 14px;margin-right:12px;border-radius:20px;font-size:13px;font-weight:700;display:inline-block;}

@keyframes scrollTiles{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

.rate-box{background:#0f0f0f;padding:15px;margin:4px 6px;border-radius:14px;border:2px solid #D4AF37;}
.rate-box h3{color:#D4AF37;}
.rate-box p{color:#eee;}

.hero{margin:15px;padding:0 10px;}
.hero-left{height:230px;background-size:cover;background-position:center;border-radius:12px;position:relative;cursor:pointer;}
.hero-left .text{position:absolute;bottom:0;width:100%;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,0.9));}
.hero-left h2{color:#fff;}

.highlight-box{padding:0 12px;}
.highlight{background:#fff;padding:12px;margin-bottom:10px;border-left:5px solid #d60000;border-radius:10px;cursor:pointer;}

.section-title{font-size:18px;font-weight:700;margin:20px 12px 10px;border-left:5px solid #d60000;padding-left:10px;}

.grid{display:grid;gap:15px;padding:0 12px;}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 6px rgba(0,0,0,0.1);cursor:pointer;}
.card img{width:100%;height:170px;object-fit:cover;}
.card .content{padding:12px;}

footer{background:#111;color:#ccc;text-align:center;padding:12px;font-size:12px;margin-top:20px;}

.popup-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999;}
.popup-box{background:#fff;width:100%;max-width:420px;border-radius:12px;padding:20px;max-height:90vh;overflow:auto;position:relative;}
.popup-close{position:absolute;top:10px;right:12px;background:#d60000;color:#fff;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;}
.popup-img{width:100%;border-radius:10px;margin-bottom:10px;}
.popup-title{font-size:20px;font-weight:800;color:#d60000;}
.popup-text{white-space:pre-line;}

.btns{display:flex;justify-content:flex-end;margin-top:10px;}
.close-btn,.share-btn{padding:10px;border:none;border-radius:8px;cursor:pointer;}
.close-btn{background:#444;color:#fff;}
.share-btn{background:#d60000;color:#fff;margin-left:10px;}
</style>
</head>

<body>

<header>
  <div class="logo">Dungarpur Live News <div class="live-dot"></div></div>
  <div class="time-box">
    <span id="live-date"></span><br>
    <span id="live-time"></span>
  </div>
</header>

<div class="tile-ticker"><div class="tile-track" id="tileTrack"></div></div>

<div class="rate-box">
  <h3>💎 KESRI Jewellers — Live Rate</h3>
  <p id="rateText">Loading...</p>
</div>

<div class="hero">
  <div class="hero-left" id="heroImg">
    <div class="text"><h2 id="heroTitle">Loading...</h2></div>
  </div>
</div>

<div class="highlight-box" id="highlightBox"></div>

<h2 class="section-title">Top Local News</h2>
<div class="grid" id="newsGrid"></div>

<footer>© 2025 Dungarpur Live News</footer>

<!-- POPUP -->
<div class="popup-bg" id="popup">
  <div class="popup-box">
    <button class="popup-close" onclick="closePopup()">×</button>
    <img id="pImg" class="popup-img">
    <div class="popup-title" id="pTitle"></div>
    <div class="popup-text" id="pText"></div>
    <div class="btns">
      <button class="close-btn" onclick="closePopup()">Close</button>
      <button class="share-btn" onclick="shareNews()">Share</button>
    </div>
  </div>
</div>

<script>
// LIVE TIME
function updateDateTime(){
  const now = new Date();
  document.getElementById('live-date').innerText =
    now.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  document.getElementById('live-time').innerText =
    now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}
setInterval(updateDateTime,1000);updateDateTime();

// SAFE DATE FORMAT
function formatDate(d){
  if(!d) return "";
  if(typeof d === "number"){
    let utc_days = Math.floor(d - 25569);
    let date = new Date(utc_days * 86400 * 1000);
    return date.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  }
  return d;
}

// POPUP
function openPopup(title,text,date,img){
  document.getElementById("pTitle").innerText=title;
  document.getElementById("pImg").src=img || "https://via.placeholder.com/400";
  document.getElementById("pText").innerText=(date? "📅 "+date+"\n\n":"")+text;
  document.getElementById("popup").style.display="flex";
}
function closePopup(){document.getElementById("popup").style.display="none";}

// SHARE
function shareNews(){
  let title=document.getElementById("pTitle").innerText;
  let url="https://dungarpurlivenews.in";

  if(navigator.share){
    navigator.share({title,text:title,url});
  }else{
    navigator.clipboard.writeText(url);
    alert("Link copied!");
  }
}

// LOAD SHEET
const sheetURL="https://docs.google.com/spreadsheets/d/16Lzi_aU5Rg1Py7A0PGbKNJ-1Yu7TjUDCMJa1_R7KnrA/gviz/tq?tqx=out:json";

async function loadSheet(){
  let res=await fetch(sheetURL);
  let text=await res.text();

  let jsonText=text.match(/setResponse\\((.*)\\);/s);
  let data=JSON.parse(jsonText[1]);

  let rows=data.table.rows.reverse();

  let tiles="",news="",highlight="";

  rows.forEach(r=>{
    let c=r.c||[];

    let type=c[0]?.v||"";
    let gold=c[1]?.v||"";
    let silver=c[2]?.v||"";
    let title=c[3]?.v||"";
    let img=c[4]?.v||"";
    let desc=c[5]?.v||"";
    let date=formatDate(c[6]?.v);

    if(type==="rate"){
      document.getElementById("rateText").innerText=`Gold: ₹${gold} | Silver: ₹${silver}`;
    }

    if(type==="hero"){
      let hero=document.getElementById("heroImg");
      hero.style.backgroundImage=`url('${img}')`;
      document.getElementById("heroTitle").innerText=title;
      hero.onclick=()=>openPopup(title,desc,date,img);
    }

    if(type==="highlight"){
      highlight+=`<div class="highlight" onclick="openPopup('${title}','${desc}','${date}','${img}')">⚡ ${title}</div>`;
    }

    if(type==="news"){
      tiles+=`<span class="tile">${title}</span>`;

      news+=`
      <div class="card" onclick="openPopup('${title}','${desc}','${date}','${img}')">
        <img loading="lazy" src="${img||'https://via.placeholder.com/300'}">
        <div class="content">
          <h3>${title}</h3>
          <p>📅 ${date}</p>
          <p>${desc.length>60?desc.substring(0,60)+"...":desc}</p>
        </div>
      </div>`;
    }
  });

  document.getElementById("highlightBox").innerHTML=highlight;
  document.getElementById("newsGrid").innerHTML=news;

  let ticker=document.getElementById("tileTrack");
  ticker.innerHTML=tiles+tiles;
}

loadSheet();
</script>

</body>
</html>
